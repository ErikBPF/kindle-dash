name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: renderer/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r renderer/requirements.txt ruff==0.12.3

      - name: Lint
        run: ruff check renderer/app.py tools tests

      - name: Contract tests
        run: python -m unittest discover -s tests -v

      - name: Compile
        run: python -m compileall -q renderer tools tests

      - name: Build container
        run: docker build --tag kindle-dash:test renderer

      - name: Scan container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kindle-dash:test
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Scan repository
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-ci:
    needs: [validate, secrets]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Notify CI channel
        env:
          WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
        run: |
          if [[ -z "$WEBHOOK" ]]; then echo "::notice::DISCORD_CI_WEBHOOK not configured"; exit 0; fi
          jq -nc --arg repo "$GITHUB_REPOSITORY" --arg ref "$GITHUB_REF_NAME" --arg actor "$GITHUB_ACTOR" --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{allowed_mentions:{parse:[]},embeds:[{title:"CI FAILED",description:("**Repository:** `"+$repo+"`\n**Ref:** `"+$ref+"`\n**Actor:** `"+$actor+"`\n[Open workflow]("+$url+")"),color:15548997}]}' |
            curl -fsS -H "Content-Type: application/json" --data @- "$WEBHOOK"
